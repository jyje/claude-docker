name: cache-prime

# Prime the default-branch cache without publishing a container image.
# Version PR checks can then read layers built with the current Dockerfile.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prime:
    name: 🧪 Prime cache (${{ matrix.platform }})
    if: ${{ github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build, smoke test, and write cache without publishing
        uses: ./.github/actions/build-native
        with:
          platform: ${{ matrix.platform }}
          cache-write: 'true'
