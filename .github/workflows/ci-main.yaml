name: ci-main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci-main.yaml
      - Dockerfile
      - package.json
      - init-firewall.sh
      - hello.sh

jobs:
  init:
    name: 🧐 Initialize
    runs-on: ubuntu-24.04-arm
    outputs:
      skip_ci: ${{ steps.check_flag.outputs.skip_ci }}
      image_version: ${{ steps.check_tag.outputs.image_version }}
      image_major: ${{ steps.check_tag.outputs.image_major }}
      image_minor: ${{ steps.check_tag.outputs.image_minor }}
      tag_exists: ${{ steps.check_tag.outputs.tag_exists }}
      is_latest: ${{ steps.check_tag.outputs.is_latest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for --no-ci flag in commit message
        id: check_flag
        run: |
          echo "Checking commit message for --no-ci flag..."
          if echo "${{ github.event.head_commit.message }}" | grep -- '--no-ci'; then
            echo "Skipping CI"
            echo "skip_ci=true" >> $GITHUB_OUTPUT
          else
            echo "skip_ci=false" >> $GITHUB_OUTPUT
          fi

      - name: Check release tag
        id: check_tag
        run: |
          VERSION=$(cat package.json | jq -r '.dependencies["@anthropic-ai/claude-code"]')
          echo "image_version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "image_major=v$(echo $VERSION | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "image_minor=v$(echo $VERSION | cut -d. -f1,2)" >> $GITHUB_OUTPUT
      
          export TAG_NAME="v${VERSION}"
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Tag $TAG_NAME does not meet the required format 'vX.Y.Z'."
            exit 1
          fi

          git fetch --unshallow --tags
          export TAG_EXISTS=$(git tag --list $TAG_NAME)
          if [ -n "$TAG_EXISTS" ]; then
            echo "Tag $TAG_NAME already exists."
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi
          
          # Check if this is the absolute latest version
          LATEST_VERSION=$( (git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'; echo "$VERSION") | sort -V | tail -n 1 )
          if [ "$VERSION" = "$LATEST_VERSION" ]; then
            echo "Version $VERSION is the absolute latest. Will apply 'latest' along with major/minor tags."
            echo "is_latest=true" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION is older. The currently highest is $LATEST_VERSION. Will only tag $TAG_NAME."
            echo "is_latest=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: 🏗️ Build
    needs: init
    if: ${{ needs.init.outputs.skip_ci == 'false' && needs.init.outputs.tag_exists == 'false' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Claude Code version
        id: version
        run: |
          VERSION=$(cat package.json | jq -r '.dependencies["@anthropic-ai/claude-code"]')
          echo "claude_version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set Docker tags
        id: docker_tags
        run: |
          DOCKER_IMAGE="ghcr.io/${{ github.repository }}"
          TAGS="${DOCKER_IMAGE}:${{ needs.init.outputs.image_version }}"
          if [ "${{ needs.init.outputs.is_latest }}" = "true" ]; then
            TAGS="${TAGS},${DOCKER_IMAGE}:latest,${DOCKER_IMAGE}:${{ needs.init.outputs.image_major }},${DOCKER_IMAGE}:${{ needs.init.outputs.image_minor }}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build/Publish as GitHub Package
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            CLAUDE_CODE_VERSION=${{ steps.version.outputs.claude_version }}
          tags: ${{ steps.docker_tags.outputs.tags }}
          # Multi-arch annotations for ghcr.io package page
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.description=Community-maintained Claude Code Docker Image (Node.js 24)
            index:org.opencontainers.image.licenses=MIT
            index:org.opencontainers.image.title=${{ github.repository }}
            index:org.opencontainers.image.url=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.version=${{ needs.init.outputs.image_version }}

      - name: Test image
        run: |
          docker run -i ghcr.io/${{ github.repository }}:${{ needs.init.outputs.image_version }} claude --version

  release:
    name: 🚀 Release
    needs: [ init, build ]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          tag_prefix: ""
          custom_tag: ${{ needs.init.outputs.image_version }}
          github_token: ${{ secrets.GITHUB_TOKEN }}


      - name: Generate Release Body
        id: release_body
        run: |
          BODY_FILE="release_body.md"
          cat <<EOF > $BODY_FILE
          ## Claude Docker: Community Docker Image
          
          This release contains Claude Code version ${{ needs.init.outputs.image_version }}.

          Available image tags for this release:
          - \`${{ needs.init.outputs.image_version }}\`
          EOF
          
          if [ "${{ needs.init.outputs.is_latest }}" = "true" ]; then
            cat <<EOF >> $BODY_FILE
          - \`${{ needs.init.outputs.image_major }}\`
          - \`${{ needs.init.outputs.image_minor }}\`
          EOF
          else
            cat <<EOF >> $BODY_FILE

          > **Note**: This is a patch release for an older version. The \`${{ needs.init.outputs.image_major }}\` and \`${{ needs.init.outputs.image_minor }}\` tags were not assigned to this image to prevent overriding newer versions.
          EOF
          fi
          
          cat <<EOF >> $BODY_FILE

          ### Usage

          \`\`\`bash
          docker pull ghcr.io/${{ github.repository }}:${{ needs.init.outputs.image_version }}
          docker run --rm -it -e ANTHROPIC_API_KEY -v \$(pwd):/workspace ghcr.io/${{ github.repository }}:${{ needs.init.outputs.image_version }}
          \`\`\`

          ### Changelog

          ${{ steps.tag_version.outputs.changelog }}
          EOF

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.init.outputs.image_version }}
          name: "Claude Docker ${{ needs.init.outputs.image_version }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          bodyFile: "release_body.md"

  cleanup:
    name: 🧹 Cleanup
    needs: [ release ]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Delete merged version branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          merged_branches=$(gh pr list --state merged --base main --limit 10 --json headRefName --jq '.[].headRefName' | grep '^version/' || true)
          for branch in $merged_branches; do
            echo "Checking remote branch: $branch"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Branch $branch still exists remotely. Deleting..."
              git push origin --delete "$branch" || echo "Failed to delete $branch"
            fi
          done

