name: ci-develop

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/ci-develop.yaml
      - Dockerfile
      - package.json
      - init-firewall.sh
      - hello.sh

jobs:
  init:
    name: 🧐 Initialize
    runs-on: ubuntu-26.04-arm
    outputs:
      step_init: ${{ steps.check_flag.outputs.step_init }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for --no-ci flag in commit message
        id: check_flag
        run: |
          echo "Checking commit message for --no-ci flag..."
          if echo "${{ github.event.head_commit.message }}" | grep -- '--no-ci'; then
            echo "step_init=false" >> $GITHUB_OUTPUT
          else
            echo "step_init=true" >> $GITHUB_OUTPUT
          fi

  build-and-testing:
    name: 🏗️ Build and testing
    needs: init
    if: ${{ needs.init.outputs.step_init == 'true' }}
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Constants
        run: |
          echo "DEV_IMAGE_HASH_LENGTH=20" >> $GITHUB_ENV
          echo "DEV_IMAGE_WINDOW_SIZE=20" >> $GITHUB_ENV

      - name: Extract short SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-${DEV_IMAGE_HASH_LENGTH})" >> $GITHUB_ENV

      - name: Extract Claude Code version
        id: version
        run: |
          VERSION=$(cat package.json | jq -r '.dependencies["@anthropic-ai/claude-code"]')
          echo "claude_version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build/Publish as GitHub Package
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            CLAUDE_CODE_VERSION=${{ steps.version.outputs.claude_version }}
          tags: |
            ghcr.io/${{ github.repository }}-dev:latest
            ghcr.io/${{ github.repository }}-dev:${{ env.SHORT_SHA }}
          # Multi-arch annotations for ghcr.io package page
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.description=Community-maintained Claude Code Docker Image (Node.js 24) - Development Build
            index:org.opencontainers.image.licenses=MIT
            index:org.opencontainers.image.title=${{ github.repository }}-dev
            index:org.opencontainers.image.url=https://github.com/${{ github.repository }}

      - name: Test image
        run: |
          docker run -i ghcr.io/${{ github.repository }}-dev:${{ env.SHORT_SHA }} claude --version

      - name: Verify multi-architecture manifest
        run: |
          RAW=$(docker buildx imagetools inspect --raw ghcr.io/${{ github.repository }}-dev:${{ env.SHORT_SHA }})
          for p in linux/amd64 linux/arm64; do
            echo "$RAW" | jq -e --arg p "$p" '.manifests[] | select(.platform.os + "/" + .platform.architecture == $p)' >/dev/null \
              || { echo "::error::Missing platform manifest: $p"; exit 1; }
            echo "Found platform manifest: $p"
          done

      - name: Clean up old dev images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          PACKAGE_NAME="$(echo '${{ github.repository }}' | cut -d'/' -f2)-dev"
          
          # Check if the owner is a user or an organization
          API_PREFIX="users"
          if gh api /orgs/$OWNER >/dev/null 2>&1; then
            API_PREFIX="orgs"
          fi
          
          echo "Looking for versions in /$API_PREFIX/$OWNER/packages/container/$PACKAGE_NAME"
          # Fetch all version IDs sorted by creation date (newest first)
          VERSIONS=$(gh api -H "Accept: application/vnd.github+json" /$API_PREFIX/$OWNER/packages/container/$PACKAGE_NAME/versions --paginate | jq -r 'sort_by(.created_at) | reverse | .[].id')
          
          TOTAL=$(echo "$VERSIONS" | wc -w)
          echo "Total versions found: $TOTAL. Window size is $DEV_IMAGE_WINDOW_SIZE."
          
          if [ "$TOTAL" -gt "$DEV_IMAGE_WINDOW_SIZE" ]; then
            # Exclude the most recent DEV_IMAGE_WINDOW_SIZE items, delete the rest
            IDS_TO_DELETE=$(echo "$VERSIONS" | tail -n +$((DEV_IMAGE_WINDOW_SIZE + 1)))
            for id in $IDS_TO_DELETE; do
              echo "Deleting package version ID: $id"
              gh api --method DELETE -H "Accept: application/vnd.github+json" /$API_PREFIX/$OWNER/packages/container/$PACKAGE_NAME/versions/$id || echo "Failed to delete version ID $id"
            done
          else
            echo "Window size not exceeded. Skipping cleanup."
          fi
