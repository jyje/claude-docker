name: ci-develop

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/ci-develop.yaml
      - Dockerfile
      - package.json
      - init-firewall.sh
      - hello.sh

env:
  # Characters of the commit SHA used for the immutable dev tag.
  DEV_IMAGE_HASH_LENGTH: 20
  # Number of dev BUILDS to keep in GHCR. Each build publishes one tagged
  # image index plus one untagged child manifest per platform, and the
  # cleanup job resolves those children so a build is always retained or
  # removed as a whole.
  DEV_IMAGE_WINDOW_SIZE: 20

jobs:
  init:
    name: 🧐 Initialize
    runs-on: ubuntu-26.04-arm
    outputs:
      step_init: ${{ steps.check_flag.outputs.step_init }}
      short_sha: ${{ steps.short_sha.outputs.short_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for --no-ci flag in commit message
        id: check_flag
        run: |
          echo "Checking commit message for --no-ci flag..."
          if echo "${{ github.event.head_commit.message }}" | grep -- '--no-ci'; then
            echo "step_init=false" >> $GITHUB_OUTPUT
          else
            echo "step_init=true" >> $GITHUB_OUTPUT
          fi

      - name: Extract short SHA
        id: short_sha
        run: |
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-${DEV_IMAGE_HASH_LENGTH})" >> $GITHUB_OUTPUT

  build:
    name: 🏗️ Build (${{ matrix.platform }})
    needs: init
    if: ${{ needs.init.outputs.step_init == 'true' }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Claude Code version
        id: version
        run: |
          VERSION=$(cat package.json | jq -r '.dependencies["@anthropic-ai/claude-code"]')
          echo "claude_version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build/Publish native platform image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}-dev,push-by-digest=true,name-canonical=true,push=true
          provenance: false
          build-args: |
            CLAUDE_CODE_VERSION=${{ steps.version.outputs.claude_version }}

      - name: Test native image
        run: |
          docker run -i ghcr.io/${{ github.repository }}-dev@${{ steps.build.outputs.digest }} claude --version

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  manifest:
    name: 📦 Manifest
    needs: [ init, build ]
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-architecture manifest
        working-directory: /tmp/digests
        run: |
          DOCKER_IMAGE="ghcr.io/${{ github.repository }}-dev"
          docker buildx imagetools create \
            -t "${DOCKER_IMAGE}:latest" \
            -t "${DOCKER_IMAGE}:${{ needs.init.outputs.short_sha }}" \
            --annotation index:org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --annotation index:org.opencontainers.image.description="Community-maintained Claude Code Docker Image (Node.js 26) - Development Build" \
            --annotation index:org.opencontainers.image.licenses="MIT" \
            --annotation index:org.opencontainers.image.title="${{ github.repository }}-dev" \
            --annotation index:org.opencontainers.image.url="https://github.com/${{ github.repository }}" \
            $(for digest in *; do echo "${DOCKER_IMAGE}@sha256:${digest}"; done)

      - name: Verify multi-architecture manifest
        uses: ./.github/actions/verify-multiarch-manifest
        with:
          image: ghcr.io/${{ github.repository }}-dev:${{ needs.init.outputs.short_sha }}

  cleanup:
    name: 🧹 Cleanup old dev images
    needs: manifest
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Delete old dev image versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail

          # DEV_IMAGE_WINDOW_SIZE counts dev BUILDS, not package versions. See
          # the env block at the top of this workflow.
          OWNER="${{ github.repository_owner }}"
          PACKAGE_NAME="$(echo '${{ github.repository }}' | cut -d'/' -f2)-dev"
          # Registry paths are case-sensitive and always lowercase.
          REPO_PATH="$(echo "${OWNER}/${PACKAGE_NAME}" | tr '[:upper:]' '[:lower:]')"

          # Check if the owner is a user or an organization
          API_PREFIX="users"
          if gh api /orgs/$OWNER >/dev/null 2>&1; then
            API_PREFIX="orgs"
          fi
          VERSIONS_API="/$API_PREFIX/$OWNER/packages/container/$PACKAGE_NAME/versions"

          echo "Looking for versions in $VERSIONS_API"
          # --paginate emits one JSON array per page, so stream elements and
          # re-collect them into a single array.
          VERSIONS=$(gh api -H "Accept: application/vnd.github+json" "$VERSIONS_API" --paginate --jq '.[]' | jq -s '.')
          TOTAL=$(echo "$VERSIONS" | jq 'length')

          # Keep the most recent tagged image indexes. Untagged versions are
          # child manifests and are protected below via their parent.
          KEEP=$(echo "$VERSIONS" | jq --argjson n "$DEV_IMAGE_WINDOW_SIZE" '
            [ .[] | select((.metadata.container.tags | length) > 0) ]
            | sort_by(.created_at) | reverse | .[0:$n]')
          KEEP_COUNT=$(echo "$KEEP" | jq 'length')
          echo "Total package versions: $TOTAL. Keeping the newest $KEEP_COUNT of $DEV_IMAGE_WINDOW_SIZE builds."

          if [ "$KEEP_COUNT" -eq 0 ]; then
            echo "::error::No tagged versions found. Refusing to delete anything."
            exit 1
          fi

          REG_TOKEN=$(curl -fsSL -u "${REGISTRY_USER}:${GH_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${REPO_PATH}:pull&service=ghcr.io" | jq -r '.token')

          # Protected set: each kept index, plus every child manifest it references.
          PROTECTED=$(mktemp)
          echo "$KEEP" | jq -r '.[].name' > "$PROTECTED"

          while read -r digest; do
            RAW=$(curl -fsSL -H "Authorization: Bearer ${REG_TOKEN}" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json" \
              "https://ghcr.io/v2/${REPO_PATH}/manifests/${digest}") || {
                echo "::error::Could not inspect ${digest}. Refusing to delete anything."
                exit 1
              }
            echo "$RAW" | jq -r '.manifests[]?.digest // empty' >> "$PROTECTED"
          done < <(echo "$KEEP" | jq -r '.[].name')

          sort -u "$PROTECTED" -o "$PROTECTED"
          echo "Protected versions (indexes and their children): $(wc -l < "$PROTECTED")"

          # Warn about kept tags whose child manifests are already gone. These
          # pull fine for one platform and fail for the other.
          while read -r digest; do
            if ! echo "$VERSIONS" | jq -e --arg d "$digest" 'any(.[]; .name == $d)' >/dev/null; then
              echo "::warning::Child manifest $digest is referenced by a kept tag but no longer exists in the registry"
            fi
          done < "$PROTECTED"

          DELETED=0
          while read -r id digest; do
            if grep -qxF "$digest" "$PROTECTED"; then
              continue
            fi
            echo "Deleting package version $id ($digest)"
            gh api --method DELETE -H "Accept: application/vnd.github+json" "$VERSIONS_API/$id" \
              && DELETED=$((DELETED + 1)) \
              || echo "::warning::Failed to delete version $id"
          done < <(echo "$VERSIONS" | jq -r '.[] | "\(.id) \(.name)"')

          echo "Deleted $DELETED version(s); $(wc -l < "$PROTECTED") retained."
