name: ci-develop

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/ci-develop.yaml
      - Dockerfile
      - package.json
      - init-firewall.sh
      - hello.sh

jobs:
  init:
    name: 🧐 Initialize
    runs-on: ubuntu-26.04-arm
    outputs:
      step_init: ${{ steps.check_flag.outputs.step_init }}
      short_sha: ${{ steps.short_sha.outputs.short_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for --no-ci flag in commit message
        id: check_flag
        run: |
          echo "Checking commit message for --no-ci flag..."
          if echo "${{ github.event.head_commit.message }}" | grep -- '--no-ci'; then
            echo "step_init=false" >> $GITHUB_OUTPUT
          else
            echo "step_init=true" >> $GITHUB_OUTPUT
          fi

      - name: Extract short SHA
        id: short_sha
        run: |
          DEV_IMAGE_HASH_LENGTH=20
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-${DEV_IMAGE_HASH_LENGTH})" >> $GITHUB_OUTPUT

  build:
    name: 🏗️ Build (${{ matrix.platform }})
    needs: init
    if: ${{ needs.init.outputs.step_init == 'true' }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Claude Code version
        id: version
        run: |
          VERSION=$(cat package.json | jq -r '.dependencies["@anthropic-ai/claude-code"]')
          echo "claude_version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build/Publish native platform image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}-dev,push-by-digest=true,name-canonical=true,push=true
          provenance: false
          build-args: |
            CLAUDE_CODE_VERSION=${{ steps.version.outputs.claude_version }}

      - name: Test native image
        run: |
          docker run -i ghcr.io/${{ github.repository }}-dev@${{ steps.build.outputs.digest }} claude --version

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  manifest:
    name: 📦 Manifest
    needs: [ init, build ]
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-architecture manifest
        working-directory: /tmp/digests
        run: |
          DOCKER_IMAGE="ghcr.io/${{ github.repository }}-dev"
          docker buildx imagetools create \
            -t "${DOCKER_IMAGE}:latest" \
            -t "${DOCKER_IMAGE}:${{ needs.init.outputs.short_sha }}" \
            --annotation index:org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --annotation index:org.opencontainers.image.description="Community-maintained Claude Code Docker Image (Node.js 24) - Development Build" \
            --annotation index:org.opencontainers.image.licenses="MIT" \
            --annotation index:org.opencontainers.image.title="${{ github.repository }}-dev" \
            --annotation index:org.opencontainers.image.url="https://github.com/${{ github.repository }}" \
            $(for digest in *; do echo "${DOCKER_IMAGE}@sha256:${digest}"; done)

      - name: Verify multi-architecture manifest
        uses: ./.github/actions/verify-multiarch-manifest
        with:
          image: ghcr.io/${{ github.repository }}-dev:${{ needs.init.outputs.short_sha }}

  cleanup:
    name: 🧹 Cleanup old dev images
    needs: manifest
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Delete old dev image versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEV_IMAGE_WINDOW_SIZE=20
          OWNER="${{ github.repository_owner }}"
          PACKAGE_NAME="$(echo '${{ github.repository }}' | cut -d'/' -f2)-dev"

          # Check if the owner is a user or an organization
          API_PREFIX="users"
          if gh api /orgs/$OWNER >/dev/null 2>&1; then
            API_PREFIX="orgs"
          fi

          echo "Looking for versions in /$API_PREFIX/$OWNER/packages/container/$PACKAGE_NAME"
          # Fetch all version IDs sorted by creation date (newest first)
          VERSIONS=$(gh api -H "Accept: application/vnd.github+json" /$API_PREFIX/$OWNER/packages/container/$PACKAGE_NAME/versions --paginate | jq -r 'sort_by(.created_at) | reverse | .[].id')

          TOTAL=$(echo "$VERSIONS" | wc -w)
          echo "Total versions found: $TOTAL. Window size is $DEV_IMAGE_WINDOW_SIZE."

          if [ "$TOTAL" -gt "$DEV_IMAGE_WINDOW_SIZE" ]; then
            # Exclude the most recent DEV_IMAGE_WINDOW_SIZE items, delete the rest
            IDS_TO_DELETE=$(echo "$VERSIONS" | tail -n +$((DEV_IMAGE_WINDOW_SIZE + 1)))
            for id in $IDS_TO_DELETE; do
              echo "Deleting package version ID: $id"
              gh api --method DELETE -H "Accept: application/vnd.github+json" /$API_PREFIX/$OWNER/packages/container/$PACKAGE_NAME/versions/$id || echo "Failed to delete version ID $id"
            done
          else
            echo "Window size not exceeded. Skipping cleanup."
          fi
