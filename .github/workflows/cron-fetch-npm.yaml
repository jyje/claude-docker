name: cron-fetch-npm

on:
  schedule:
    # Safety net only. ci-main dispatches this workflow right after each release,
    # so a backlog is worked through without waiting for a tick. The minute is
    # deliberately not 0: scheduled runs on the hour queue behind everyone else's
    # and were observed starting 2.5 to 4.7 hours late.
    - cron: '23 */6 * * *'
  workflow_dispatch:

# A chained run and a scheduled tick must not race to create the same branch or PR.
concurrency:
  group: cron-fetch-npm
  cancel-in-progress: false

jobs:
  check-claude-version:
    name: 🔍 Check NPM Version
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
      pull-requests: write
      # Needed to dispatch pr-version-check and to see whether it already ran.
      actions: write
      checks: read
    env:
      # Configurable via the repository variable BASELINE_VERSION (Settings > Secrets and variables > Actions > Variables).
      # Falls back to 2.1.34 if the variable is unset.
      BASELINE_VERSION: ${{ vars.BASELINE_VERSION || '2.1.34' }}
      UPDATE_NEEDED: 'false'
      TARGET_VERSION: ''
      PR_EXISTS: 'false'
      HAS_OPEN_VERSION_PR: 'false'
      TAG_EXISTS: 'false'
      SHOULD_CREATE_PR: 'false'
    steps:
      # Branches and PRs created with the default GITHUB_TOKEN do not fire
      # push or pull_request events, so pr-version-check would never start on
      # a new version PR by itself. An installation token for the jyje-bot
      # GitHub App is an ordinary, trusted identity: its pushes and PRs start
      # the PR workflows right away, with no manual approval.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Export GH_TOKEN for gh CLI steps
        run: echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Fetch all NPM versions
        id: npm_versions
        run: |
          npm view @anthropic-ai/claude-code versions --json | jq -r '.[]' > npm_versions.txt
          echo "Fetched $(wc -l < npm_versions.txt) versions from npm"

      - name: Find oldest missing version vs git tags
        id: pick_oldest
        run: |
          git fetch --unshallow --tags
          git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -u > tagged_versions.txt
          # Only consider version since the baseline as minimum
          (cat npm_versions.txt; echo "$BASELINE_VERSION") | sort -V | uniq | awk -v base="$BASELINE_VERSION" 'BEGIN{found=0} $0 == base {found=1} found{print}' | sort -u > n.txt
          echo "Considering $(wc -l < n.txt) npm versions (>= $BASELINE_VERSION)"
          sort -u tagged_versions.txt > t.txt
          comm -23 n.txt t.txt > missing_versions.txt
          TARGET_VERSION=$(sort -V missing_versions.txt | head -n 1)
          if [ -z "$TARGET_VERSION" ]; then
            echo "No missing versions; all npm versions have a tag."
            echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
          else
            echo "Oldest missing version: $TARGET_VERSION"
            echo "TARGET_VERSION=$TARGET_VERSION" >> $GITHUB_ENV
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
          fi

      - name: Check for existing PR and open version PRs
        if: env.UPDATE_NEEDED == 'true'
        id: check_pr
        run: |
          PR_TITLE="⬆️ dep(claude): update claude version to v${{ env.TARGET_VERSION }}"
          gh pr list --state open --base main --json title > pr_list.json
          # PR for this specific version already open?
          jq -e ".[] | select(.title == \"$PR_TITLE\")" pr_list.json >/dev/null 2>&1 && \
            echo "PR_EXISTS=true" >> $GITHUB_ENV || echo "PR_EXISTS=false" >> $GITHUB_ENV
          # Any open version PR (avoid multiple open version PRs → merge conflicts when one is merged)
          OPEN_COUNT=$(jq -r '.[].title' pr_list.json | grep -cE '^⬆️ dep\(claude\): update claude version to v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ "${OPEN_COUNT:-0}" -ge 1 ]; then
            echo "HAS_OPEN_VERSION_PR=true" >> $GITHUB_ENV
          else
            echo "HAS_OPEN_VERSION_PR=false" >> $GITHUB_ENV
          fi

      - name: Check for existing tag
        uses: Wandalen/wretry.action@v3
        id: check_tag
        if: env.UPDATE_NEEDED == 'true' && env.PR_EXISTS == 'false' && env.HAS_OPEN_VERSION_PR == 'false'
        with:
          attempt_limit: 3
          attempt_delay: 10000
          command: |
            git fetch --tags
            git tag --list "v${{ env.TARGET_VERSION }}" > tag_list.txt
            if [ -s tag_list.txt ]; then
              echo "TAG_EXISTS=true" >> $GITHUB_ENV
            else
              echo "TAG_EXISTS=false" >> $GITHUB_ENV
            fi

      # One place that decides whether a new PR is created, so the steps below
      # cannot drift apart.
      - name: Decide whether to create a PR
        if: env.UPDATE_NEEDED == 'true' && env.PR_EXISTS == 'false' && env.HAS_OPEN_VERSION_PR == 'false' && env.TAG_EXISTS == 'false'
        run: echo "SHOULD_CREATE_PR=true" >> "$GITHUB_ENV"

      - name: Create new branch and update version
        if: env.SHOULD_CREATE_PR == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Remove any orphaned remote branch left over from a prior run
          # whose PR creation failed (e.g. transient GitHub API errors),
          # so this run can push a fresh branch from main without
          # hitting a non-fast-forward rejection.
          git push origin --delete version/${{ env.TARGET_VERSION }} 2>/dev/null || true

          git checkout -b version/${{ env.TARGET_VERSION }} main
          
          # Update package.json: dependencies and version
          jq '.dependencies["@anthropic-ai/claude-code"] = "${{ env.TARGET_VERSION }}" | .version = "${{ env.TARGET_VERSION }}"' package.json > package.json.tmp
          mv package.json.tmp package.json
          
          # Update Dockerfile ARG default value for reproducibility
          sed -i "s/^ARG CLAUDE_CODE_VERSION=.*/ARG CLAUDE_CODE_VERSION=${{ env.TARGET_VERSION }}/" Dockerfile
          
          git add package.json Dockerfile
          git commit \
            -m "⬆️ dep(claude): update claude version to v${{ env.TARGET_VERSION }}" \
            -m "Upgrade the underlying Claude model or software version to the newest release." \
            -m "Co-authored-by: jyje <jyjeon@outlook.com>" \
            --allow-empty
          git push origin version/${{ env.TARGET_VERSION }}

      - name: Create PR
        if: env.SHOULD_CREATE_PR == 'true'
        run: |
          MISSING_CHECKLIST=$(sort -V missing_versions.txt | while IFS= read -r v; do echo "- [ ] v$v"; done)
          PR_BODY=$(printf "Automatically created PR to update Claude Code version to v%s\n\nUpstream changelog: https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md\n\nThe \`version-check\` status on this PR builds both platforms natively and should be green before merging.\n\n### Upstream versions not yet built\n\n%s" "${{ env.TARGET_VERSION }}" "$MISSING_CHECKLIST")
          gh pr create \
            --title "⬆️ dep(claude): update claude version to v${{ env.TARGET_VERSION }}" \
            --body "$PR_BODY" \
            --base main \
            --head version/${{ env.TARGET_VERSION }} \
            --assignee "${{ github.repository_owner }}"

      # A PR this run just opened with the jyje-bot token starts pr-version-check
      # through its own pull_request event. Dispatching here as well would race
      # that run before its check is registered and start a duplicate, so this
      # step only heals a version PR that already existed without the check
      # (for example one opened before this workflow used the App token).
      # workflow_dispatch attaches the check run to the branch head commit,
      # which is the commit the PR points at.
      - name: Ensure version check has run on the branch
        if: env.UPDATE_NEEDED == 'true' && env.PR_EXISTS == 'true'
        env:
          REPO: ${{ github.repository }}
          BRANCH: version/${{ env.TARGET_VERSION }}
        run: |
          SHA=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')
          COUNT=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=version-check" --jq '.total_count')
          if [ "$COUNT" -gt 0 ]; then
            echo "version-check already reported on $SHA, nothing to do."
            exit 0
          fi
          for attempt in 1 2 3; do
            if gh workflow run pr-version-check.yaml --repo "$REPO" --ref "$BRANCH"; then
              echo "Dispatched pr-version-check on $BRANCH."
              exit 0
            fi
            echo "Dispatch attempt $attempt failed, retrying in 10s."
            sleep 10
          done
          echo "::error::Could not dispatch pr-version-check on $BRANCH"
          exit 1
